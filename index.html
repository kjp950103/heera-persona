<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF">

<meta property="og:title" content="희라는 어떤 사람일까요?">
<meta property="og:description" content="퓌라 팀이 함께 그리는 페르소나, 3분이면 끝나요">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@1.6.1/dist/tossface.css">
<style>
:root{
  --white:#FFFFFF; --g50:#F9FAFB; --g100:#F2F4F6; --g200:#E5E8EB; --g300:#D1D6DB; --g400:#B0B8C1;
  --g500:#8B95A1; --g600:#6B7684; --g700:#4E5968; --g800:#333D4B; --g900:#191F28;
  --blue:#3182F6; --blue600:#2272EB; --blue50:#E8F3FF; --blue100:#C9E2FF;
  --font:"Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --emoji:"Tossface", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--white);color:var(--g900);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.e{font-family:var(--emoji);font-style:normal;line-height:1}

.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--white)}
@media (min-width:560px){ body{background:var(--g100)} .app{box-shadow:0 0 0 1px var(--g200)} }

/* 상단바 */
.appbar{position:sticky;top:0;z-index:5;background:var(--white);height:calc(56px + env(safe-area-inset-top, 0px));padding:env(safe-area-inset-top, 0px) 12px 0;display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.icon-btn:active{background:var(--g100)}
.icon-btn svg{width:24px;height:24px;stroke:var(--g900)}
.appbar .brand{font-size:15px;font-weight:600;color:var(--g700);padding-left:8px}
.appbar .sp{flex:1}
.appbar .cnt{font-size:15px;font-weight:600;color:var(--g500);padding-right:8px;font-variant-numeric:tabular-nums}
.appbar .cnt b{color:var(--blue)}
.track{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--g100)}
.track i{display:block;height:100%;background:var(--blue);transition:width .45s var(--ease)}

/* 화면 */
.screen{flex:1;display:flex;flex-direction:column;padding:8px 24px calc(124px + env(safe-area-inset-bottom, 0px))}
.enter{animation:enter .38s var(--ease)}
.enter-back{animation:enterBack .38s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.q-emoji{font-size:52px;margin:18px 0 18px}
h1{margin:0;font-size:26px;line-height:1.4;font-weight:700;letter-spacing:-0.03em;word-break:keep-all}
.desc{margin:10px 0 0;font-size:16px;color:var(--g600);word-break:keep-all}

/* 선택지 */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.opt{width:100%;min-height:62px;border-radius:16px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--g200);padding:0 18px 0 20px;
  display:flex;align-items:center;gap:12px;text-align:left;font-size:17px;font-weight:500;color:var(--g800);
  transition:box-shadow .18s var(--ease), background .18s var(--ease), transform .12s var(--ease)}
.opt:active{transform:scale(.98);background:var(--g50)}
.opt .lab{flex:1;min-width:0;padding:16px 0;word-break:keep-all}
.opt .ck{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--g200);transition:background .18s var(--ease), transform .25s var(--ease)}
.opt .ck svg{width:15px;height:15px;stroke:var(--white)}
.opt.on{box-shadow:inset 0 0 0 2px var(--blue);background:#F5F9FF;color:var(--blue600);font-weight:600}
.opt.on .ck{background:var(--blue);transform:scale(1.08)}
.other{margin-top:18px;display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--g50);padding:0 18px}
.other .e{font-size:20px}
.other input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;padding:18px 0;color:var(--g900)}
.other input::placeholder{color:var(--g400)}
.other input:focus{outline:none}

/* 입력 */
.field{margin-top:40px;position:relative}
.field input{width:100%;border:0;border-bottom:2px solid var(--g200);font:inherit;font-size:24px;font-weight:600;padding:8px 0 12px;background:none;color:var(--g900);border-radius:0;transition:border-color .2s}
.field input:focus{outline:none;border-bottom-color:var(--blue)}
.field input::placeholder{color:var(--g300);font-weight:500}
textarea.big{margin-top:32px;width:100%;min-height:160px;border:0;border-radius:16px;background:var(--g50);padding:18px 20px;font:inherit;font-size:17px;line-height:1.6;color:var(--g900);resize:none}
textarea.big:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue);background:var(--white)}
textarea.big::placeholder{color:var(--g400)}

/* 하단 버튼 */
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:6;
  padding:28px 20px calc(16px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top, var(--white) 72%, rgba(255,255,255,0))}
.cta{width:100%;height:56px;border-radius:16px;background:var(--blue);color:var(--white);font-size:17px;font-weight:600;transition:background .15s, transform .12s var(--ease), opacity .2s}
.cta:active{background:var(--blue600);transform:scale(.985)}
.cta:disabled{background:var(--blue100);color:var(--white);cursor:default;transform:none}
.cta.weak{background:var(--blue50);color:var(--blue600)}
.cta .dots{display:inline-flex;gap:5px}
.cta .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
.cta .dots i:nth-child(2){animation-delay:.15s}.cta .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
.err{margin:0 0 10px;font-size:14px;color:#F04452;text-align:center}

/* 시작 */
.intro{align-items:center;text-align:center;padding-top:28px}
.hero-e{font-size:96px;margin:24px 0 28px}
.face{width:128px;height:128px;border-radius:50%;object-fit:cover;margin:20px 0 26px;box-shadow:0 0 0 6px var(--blue50), 0 10px 30px rgba(49,130,246,.18)}
.face.sm{width:48px;height:48px;margin:0;box-shadow:none;flex:none}
.intro h1{font-size:28px}
.intro .desc{font-size:17px}
.persona{margin-top:36px;width:100%;border-radius:20px;background:var(--g50);padding:22px 22px 18px;text-align:left}
.persona .row{display:flex;gap:14px;padding:9px 0;font-size:15px}
.persona .row+.row{box-shadow:inset 0 1px 0 var(--g100)}
.persona .k{width:44px;flex:none;color:var(--g500)}
.persona .v{color:var(--g800);word-break:keep-all}
.persona .name{display:flex;align-items:center;gap:12px;padding-bottom:14px}
.persona .name .e{font-size:36px}
.persona .name b{font-size:19px;display:block}
.persona .name span{font-size:14px;color:var(--g600)}
.count-line{margin-top:20px;font-size:14px;color:var(--g500)}
.count-line b{color:var(--blue);font-weight:600}

/* 결과 */
.done{align-items:center;text-align:center;padding-top:28px}
.stats{margin-top:28px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:var(--g50);border-radius:20px;padding:20px 0}
.stats div+div{box-shadow:inset 1px 0 0 var(--g200)}
.stats b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stats b.blue{color:var(--blue)}
.stats span{font-size:13px;color:var(--g500)}
.gap{height:12px;background:var(--g100);margin:32px -24px 0}
.rq{padding:28px 0 4px;text-align:left;width:100%}
.rq + .rq{box-shadow:inset 0 1px 0 var(--g100)}
.rq .head{display:flex;align-items:flex-start;gap:12px}
.rq .head .e{font-size:28px;flex:none;margin-top:2px}
.rq .head h2{margin:0;font-size:17px;font-weight:600;line-height:1.45;color:var(--g800);word-break:keep-all;flex:1}
.badge{flex:none;font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px;margin-top:2px}
.badge.agree{background:var(--blue50);color:var(--blue600)}
.badge.split{background:var(--g100);color:var(--g600)}
.top1{margin-top:14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top1 strong{font-size:22px;font-weight:700;color:var(--g900);word-break:keep-all}
.top1 em{font-style:normal;font-size:22px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.meter{margin-top:10px;height:10px;border-radius:10px;background:var(--g100);overflow:hidden}
.meter i{display:block;height:100%;border-radius:10px;background:var(--blue);transition:width .8s var(--ease)}
.others{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.ol{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--g600)}
.ol span:last-child{font-variant-numeric:tabular-nums;color:var(--g500)}
.me{display:inline-block;font-size:12px;font-weight:600;color:var(--blue600);background:var(--blue50);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.quote{margin-top:12px;background:var(--g50);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--g800);word-break:keep-all}
.small{margin-top:12px;font-size:14px;color:var(--g500);word-break:keep-all}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;z-index:9;
  background:rgba(25,31,40,.92);color:var(--white);border-radius:14px;padding:13px 18px;font-size:15px;font-weight:500;white-space:nowrap;transition:all .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.enter,.enter-back,.rise{animation:none}.opt,.track i,.meter i,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <button class="icon-btn" id="back" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg></button>
    <span class="brand" id="brand">퓌라 마케팅팀</span>
    <span class="sp"></span>
    <span class="cnt" id="cnt" hidden></span>
    <div class="track" id="track" hidden><i id="bar" style="width:0"></i></div>
  </header>
  <main id="view"></main>
  <div class="bottom"><p class="err" id="err" hidden></p><button class="cta" id="cta"></button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const Q = [
  {id:"job", e:"💼", t:"희라는 어떤 일을 할까요?", o:["회사원(관리자급)","전문직(의료·법률 등)","자기 사업·프리랜서","크리에이티브 직군","교육·강사","전업 주부"]},
  {id:"family", e:"🏡", t:"희라는 누구와 함께 살까요?", o:["혼자","배우자와 둘이","배우자·어린 자녀와","배우자·다 큰 자녀와","부모님과"]},
  {id:"place", e:"📍", t:"희라는 어디에 살까요?", o:["서울 도심","수도권 신도시","지방 대도시","지방 중소도시"]},
  {id:"skin", e:"✨", t:"희라가 요즘 가장 신경 쓰는\n피부 고민은요?", max:2, o:["탄력·처짐","잔주름","속건조·당김","칙칙함·기미","예민·붉은기","모공·피부결"]},
  {id:"derm", e:"🏥", t:"희라는 피부과에\n다니고 있을까요?", o:["꾸준히 다녀요","다니다 지쳐서 그만뒀어요","중요한 일 앞두고만 가요","시술은 싫어서 안 해요","관심은 있지만 아직이에요"]},
  {id:"makeup", e:"💄", t:"희라는 화장을\n얼마나 할까요?", o:["거의 안 해요(선크림 정도)","가볍게 베이스만 해요","매일 제대로 해요"]},
  {id:"spend", e:"💳", t:"한 달에 스킨케어로\n얼마를 쓸까요?", o:["5만 원 이하","5만~10만 원","10만~20만 원","20만 원 이상"]},
  {id:"time", e:"🌙", t:"희라만의 시간은\n하루 중 언제일까요?", o:["이른 아침","낮","저녁","늦은 밤"]},
  {id:"apps", e:"📱", t:"희라가 휴대폰에서\n가장 오래 쓰는 앱은요?", max:3, o:["인스타그램","유튜브","네이버","카카오톡","스레드","핀터레스트","팟캐스트·오디오","뉴스레터·메일"]},
  {id:"trust", e:"🤝", t:"화장품을 고를 때\n희라가 가장 믿는 건요?", o:["피부과 의사·전문가","닮고 싶은 사람(인플루언서)","친한 친구의 추천","성분·연구 자료","많은 리뷰·후기","백화점·매장 상담"]},
  {id:"check", e:"🔍", t:"광고를 보고 끌리면\n가장 먼저 뭘 할까요?", o:["네이버에 브랜드 검색","브랜드 인스타 둘러보기","상세페이지 꼼꼼히 읽기","유튜브에서 후기 찾기","지인에게 물어보기","저장만 하고 잊기"]},
  {id:"decide", e:"👆", t:"결제 버튼을 누르게 만드는\n결정적인 한 가지는요?", o:["임상 수치","기술·연구진 이야기","실제 사용자 후기","믿는 사람의 추천","환불 보장","첫 구매 혜택"]},
  {id:"block", e:"🚪", t:"희라가 사지 않고\n나가는 이유는요?", max:2, o:["광고 냄새가 나서","처음 보는 브랜드라서","가격이 부담돼서","쓰던 제품이 있어서","효과에 확신이 없어서","구매 과정이 번거로워서"]},
  {id:"tone", e:"🎬", t:"희라의 마음을 움직일\n광고는 어떤 걸까요?", o:["조용하고 감도 높은 영상","숫자·근거가 담긴 이미지","실사용자 인터뷰","전문가의 설명","일상 브이로그"]},
  {id:"brands", e:"🧴", t:"희라 화장대에 있을 것 같은\n브랜드를 적어 주세요", free:true, ph:"예: 설화수, 라메르"},
  {id:"oneline", e:"✍️", t:"희라를 한 문장으로\n표현해 주세요", free:true, ph:"예: 남의 말보다 자기 기준이 분명한 사람"},
];
const API = "https://script.google.com/macros/s/AKfycbxXkBOA7YLDAp0gdTPkit98xvMJfskXuZF1yZC_CACtRNVjODIp_xpDK-Rxs_HsRZL4/exec";
const KEY = "heera-draft-v4";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const $ = s => document.querySelector(s);
const view = $("#view"), cta = $("#cta");
let S = {name:"", answers:{}, submitted:false};
let all = null, screen = "intro", step = 0, busy = false, dir = 1;

try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){ if(k==="class") n.className = attrs[k]; else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  kids.flat().forEach(c=>{ if(c==null || c===false) return; n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
const emoji = (c, cls) => h("i", {class:"e " + (cls||""), "aria-hidden":"true"}, c);
const lines = t => t.split("\n").flatMap((l,i)=> i ? [h("br"), l] : [l]);
function toast(msg){ const t=$("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"), 1800); }

async function api(body){
  const res = body ? await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)}) : await fetch(API);
  const d = await res.json();
  if(!d.ok) throw new Error(d.error || "저장하지 못했어요");
  return d.responses;
}

function chrome(){
  const inQ = screen === "q";
  $("#back").hidden = screen === "intro" || screen === "result";
  $("#brand").hidden = !(screen === "intro" || screen === "result");
  $("#cnt").hidden = !inQ; $("#track").hidden = !inQ;
  if(inQ){ $("#cnt").innerHTML = `<b>${step+1}</b> / ${Q.length}`; $("#bar").style.width = ((step+1)/Q.length*100) + "%"; }
  $("#err").hidden = true;
}
function go(to, s, d){ dir = d || 1; screen = to; if(s != null) step = s; render(); window.scrollTo(0,0); }

function render(){
  chrome();
  view.replaceChildren();
  const anim = dir > 0 ? "enter" : "enter-back";
  if(screen === "intro") return renderIntro();
  if(screen === "name") return renderName(anim);
  if(screen === "q") return renderQ(anim);
  if(screen === "result") return renderResult();
}

function renderIntro(){
  const n = all ? all.length : null;
  view.append(h("section", {class:"screen intro"},
    h("img", {class:"face rise", src:"heera.jpg", alt:"김희라", width:"128", height:"128"}),
    h("h1", {class:"rise", style:"animation-delay:.05s"}, "희라는 어떤 사람일까요?"),
    h("p", {class:"desc rise", style:"animation-delay:.1s"}, ...lines("퓌라 팀이 함께 그리는 광고 페르소나예요.\n희라가 되어 답해 주세요. 정답은 없어요.")),
    h("div", {class:"persona rise", style:"animation-delay:.15s"},
      h("div", {class:"name"}, h("img", {class:"face sm", src:"heera.jpg", alt:"", width:"48", height:"48"}), h("div", null, h("b", null, "김희라"), h("span", null, "44세 · 여성"))),
      ...[["철학","웰니스"],["성격","주체적, 털털함, 자기만족, 중성적, 완벽주의, 지적"],["취미","요가, 필라테스, 러닝, 다도, 독서, 일"],["식성","슴슴한 음식, 차, 소식, 술·담배 안 함"]]
        .map(([k,v])=>h("div", {class:"row"}, h("span", {class:"k"}, k), h("span", {class:"v"}, v)))
    ),
    h("p", {class:"count-line rise", style:"animation-delay:.2s"}, n == null ? "참여 현황을 불러오는 중이에요" : (n ? h("span", null, "지금까지 ", h("b", null, n + "명"), "이 참여했어요") : "첫 번째 참여자가 되어 주세요"))
  ));
  cta.className = "cta"; cta.disabled = false; cta.textContent = S.submitted ? "다시 참여하기" : "시작하기";
  cta.onclick = () => go("name");
}

function renderName(anim){
  const inp = h("input", {type:"text", maxlength:"20", placeholder:"이름", autocomplete:"name", "aria-label":"이름"});
  inp.value = S.name || "";
  const sync = () => { cta.disabled = !inp.value.trim(); };
  inp.addEventListener("input", ()=>{ S.name = inp.value.trim(); save(); sync(); });
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter" && inp.value.trim()) cta.click(); });
  view.append(h("section", {class:"screen " + anim},
    emoji("👋", "q-emoji"),
    h("h1", null, ...lines("먼저 이름을\n알려 주세요")),
    h("p", {class:"desc"}, "같은 이름으로 다시 하면 답이 바뀌어요"),
    h("div", {class:"field"}, inp)
  ));
  cta.className = "cta"; cta.textContent = "다음"; sync();
  cta.onclick = () => go("q", 0);
  setTimeout(()=>inp.focus(), 350);
}

function curA(q){ return S.answers[q.id] || (q.free ? {text:""} : {pick:[], other:""}); }
function setA(q, a){ S.answers[q.id] = a; save(); }
function canNext(q){ const a = curA(q); return q.free || a.pick.length > 0 || !!a.other; }

function renderQ(anim){
  const q = Q[step], a = curA(q), last = step === Q.length - 1;
  const sec = h("section", {class:"screen " + anim},
    emoji(q.e, "q-emoji"),
    h("h1", null, ...lines(q.t)),
    h("p", {class:"desc"}, q.free ? "생각나는 대로 적어 주세요. 비워도 괜찮아요" : q.max ? `최대 ${q.max}개까지 고를 수 있어요` : "하나를 고르면 바로 넘어가요")
  );
  const syncCta = () => {
    cta.className = "cta"; cta.disabled = busy || !canNext(q);
    cta.textContent = last ? "제출하고 결과 보기" : (q.free && !curA(q).text ? "건너뛰기" : "다음");
    if(busy){ cta.replaceChildren(h("span", {class:"dots"}, h("i"), h("i"), h("i"))); }
  };
  if(q.free){
    const ta = h("textarea", {class:"big", maxlength:"200", placeholder:q.ph, "aria-label":q.t.replace("\n"," ")});
    ta.value = a.text || "";
    ta.addEventListener("input", ()=>{ setA(q, {text: ta.value.trim()}); syncCta(); });
    sec.append(ta);
  }else{
    const box = h("div", {class:"opts", role:"group"});
    q.o.forEach(label=>{
      const on = a.pick.includes(label);
      const b = h("button", {type:"button", class:"opt" + (on ? " on" : ""), "aria-pressed": on ? "true" : "false"},
        h("span", {class:"lab"}, label), h("span", {class:"ck"}));
      b.lastChild.innerHTML = CHECK;
      b.addEventListener("click", ()=>{
        const st = curA(q); let pick = [...st.pick];
        if(pick.includes(label)) pick = pick.filter(x=>x!==label);
        else if(q.max){ if(pick.length >= q.max) pick.shift(); pick.push(label); }
        else pick = [label];
        setA(q, {...st, pick});
        [...box.children].forEach((x,i)=>{ const v = pick.includes(q.o[i]); x.classList.toggle("on", v); x.setAttribute("aria-pressed", v ? "true":"false"); });
        syncCta();
        if(!q.max && pick.length && !last) setTimeout(()=>{ if(screen==="q" && Q[step]===q) next(); }, 260);
      });
      box.append(b);
    });
    const other = h("input", {type:"text", maxlength:"60", placeholder:"목록에 없으면 직접 적어 주세요", "aria-label":"직접 입력"});
    other.value = a.other || "";
    other.addEventListener("input", ()=>{ setA(q, {...curA(q), other: other.value.trim()}); syncCta(); });
    sec.append(box, h("label", {class:"other"}, emoji("✏️"), other));
  }
  view.append(sec);
  syncCta();
  cta.onclick = () => next();
  renderQ.sync = syncCta;
}
function next(){ if(step < Q.length - 1) go("q", step + 1, 1); else submit(); }
$("#back").addEventListener("click", ()=>{
  if(screen === "name") go("intro", null, -1);
  else if(screen === "q"){ if(step > 0) go("q", step - 1, -1); else go("name", null, -1); }
});

async function submit(){
  busy = true; renderQ.sync && renderQ.sync();
  try{
    all = await api({name: S.name, answers: S.answers});
    S.submitted = true; save();
    go("result"); toast("제출했어요. 고마워요!");
  }catch(e){
    $("#err").textContent = (e && e.message) || "저장하지 못했어요. 잠시 후 다시 눌러 주세요"; $("#err").hidden = false;
  }finally{ busy = false; if(screen === "q") renderQ.sync(); }
}

function tally(q){
  const n = all.length || 1, c = {}; q.o.forEach(o=>c[o]=0);
  all.forEach(r=>(r.answers?.[q.id]?.pick||[]).forEach(p=>{ if(p in c) c[p]++; }));
  return q.o.map(label=>({label, pct:Math.round(c[label]/n*100)})).sort((a,b)=>b.pct-a.pct);
}
function renderResult(){
  const rows = all || [];
  const me = rows.find(r=>r.name === S.name);
  const choice = Q.filter(q=>!q.free);
  const agree = choice.filter(q=>rows.length && tally(q)[0].pct >= 50).length;
  const answered = choice.filter(q=>rows.length && tally(q)[0].pct > 0).length;
  const sec = h("section", {class:"screen done"},
    emoji("🎉", "hero-e rise"),
    h("h1", {class:"rise", style:"animation-delay:.05s"}, ...lines("우리 팀이 그린\n김희라예요")),
    h("p", {class:"desc rise", style:"animation-delay:.1s"}, "절반 이상이 같은 답을 고르면 교집합이에요"),
    h("div", {class:"stats rise", style:"animation-delay:.15s"},
      h("div", null, h("b", null, String(rows.length)), h("span", null, "참여")),
      h("div", null, h("b", {class:"blue"}, String(agree)), h("span", null, "교집합")),
      h("div", null, h("b", null, String(answered - agree)), h("span", null, "의견 갈림"))),
    h("div", {class:"gap"})
  );
  Q.forEach(q=>{
    const card = h("article", {class:"rq"});
    const head = h("div", {class:"head"}, emoji(q.e), h("h2", null, q.t.replace("\n"," ")));
    card.append(head);
    if(q.free){
      const texts = rows.map(r=>r.answers?.[q.id]?.text).filter(Boolean);
      if(!texts.length) card.append(h("p", {class:"small"}, "아직 적은 사람이 없어요"));
      texts.forEach(t=>card.append(h("div", {class:"quote"}, t)));
      sec.append(card); return;
    }
    const t = tally(q), ok = rows.length && t[0].pct >= 50, mine = me?.answers?.[q.id]?.pick || [];
    if(!t[0].pct){ card.append(h("p", {class:"small"}, "아직 고른 사람이 없어요")); sec.append(card); return; }
    head.append(h("span", {class:"badge " + (ok ? "agree":"split")}, ok ? "교집합" : "의견 갈림"));
    const meter = h("div", {class:"meter"}, h("i", {style:"width:0"}));
    card.append(
      h("div", {class:"top1"}, h("strong", null, t[0].label, mine.includes(t[0].label) ? h("span", {class:"me"}, "내 답") : null), h("em", null, t[0].pct + "%")),
      meter
    );
    requestAnimationFrame(()=>requestAnimationFrame(()=>meter.firstChild.style.width = t[0].pct + "%"));
    const rest = t.slice(1).filter(r=>r.pct > 0 || mine.includes(r.label));
    if(rest.length) card.append(h("div", {class:"others"}, rest.map(r=>h("div", {class:"ol"}, h("span", null, r.label, mine.includes(r.label) ? h("span", {class:"me"}, "내 답") : null), h("span", null, r.pct + "%")))));
    const others = rows.map(r=>r.answers?.[q.id]?.other).filter(Boolean);
    if(others.length) card.append(h("p", {class:"small"}, "직접 적은 답 · " + others.join(", ")));
    sec.append(card);
  });
  view.append(sec);
  cta.className = "cta weak"; cta.disabled = false; cta.textContent = "내 답 다시 고르기";
  cta.onclick = () => go("q", 0);
}

async function refresh(){
  try{ all = await api(); if(screen === "intro" || screen === "result") render(); }
  catch(e){ /* 조회 실패: 다음 새로고침 때 다시 시도 */ }
}
render();
refresh().then(()=>{ if(S.submitted && all && all.some(r=>r.name === S.name)) go("result"); });
setInterval(()=>{ if(!document.hidden && screen === "result") refresh(); }, 30000);
</script>
</body>
</html>
