<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>김희라 그리기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 토스식: 흰 바탕, 큰 제목, 넓은 선택 줄, 아래 고정 버튼. 결과는 순위 목록. */
:root{
  --bg:#FFFFFF; --sub:#F2F4F6; --line:#E5E8EB;
  --t1:#191F28; --t2:#4E5968; --t3:#8B95A1;
  --blue:#3182F6; --blue-press:#1B64DA; --blue-soft:#E8F3FF; --on-blue:#FFFFFF;
  --font:"Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17171C; --sub:#202027; --line:#2C2C35;
  --t1:#ECECEE; --t2:#B0B0B8; --t3:#7E7E87;
  --blue:#3182F6; --blue-press:#4E95F8; --blue-soft:#1A2B45; --on-blue:#FFFFFF; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
p{margin:0}
.page{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(12px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px))}
.body{flex:1;display:flex;flex-direction:column;gap:28px;padding-bottom:120px}

/* 상단 */
.nav{height:48px;display:flex;align-items:center;gap:12px}
.nav .back{width:32px;height:32px;margin-left:-6px;display:grid;place-items:center;border-radius:8px}
.nav .back svg{width:24px;height:24px;stroke:var(--t1)}
.prog{flex:1;height:4px;background:var(--sub);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s ease}
.step{font-size:14px;color:var(--t3);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

/* 제목 */
.title{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.title h1{margin:0;font-size:26px;line-height:1.38;font-weight:700;letter-spacing:-0.02em;word-break:keep-all}
.title p{font-size:17px;color:var(--t2);word-break:keep-all}
.title .hint{font-size:15px;color:var(--t3)}

/* 선택 줄 */
.list{display:flex;flex-direction:column;gap:10px}
.item{width:100%;min-height:60px;border-radius:16px;background:var(--sub);padding:16px 18px;display:flex;align-items:center;gap:12px;text-align:left;
  font-size:17px;font-weight:500;color:var(--t1);transition:background .15s, transform .1s}
.item:active{transform:scale(.98)}
.item .lab{flex:1;min-width:0;word-break:keep-all}
.item .chk{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line)}
.item .chk svg{width:14px;height:14px;stroke:var(--bg)}
.item[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.item[aria-pressed="true"] .chk{background:var(--blue)}
.item[aria-pressed="true"] .chk svg{stroke:var(--on-blue)}
@media (prefers-reduced-motion:reduce){.item,.prog i{transition:none}}

/* 입력 */
.input{width:100%;font:inherit;font-size:17px;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:12px 0;background:transparent;color:var(--t1)}
.input:focus{outline:none;border-bottom-color:var(--blue)}
.input::placeholder{color:var(--t3)}
textarea.input{min-height:120px;resize:none;border:0;background:var(--sub);border-radius:16px;padding:16px 18px;line-height:1.5}
textarea.input:focus{outline:2px solid var(--blue)}
.label{font-size:15px;color:var(--t2);font-weight:500}

/* 아래 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top, var(--bg) 70%, transparent);
  padding:20px max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
.dock .in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;height:56px;border-radius:16px;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:600}
.btn:active{background:var(--blue-press)}
.btn:disabled{opacity:.3;cursor:default}
.btn.sub{background:var(--sub);color:var(--t2)}
.err{font-size:14px;color:#F04452;text-align:center}

/* 시작 화면 */
.profile{border-radius:20px;background:var(--sub);padding:20px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:14px}
.ava{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.who b{display:block;font-size:20px}
.who span{font-size:15px;color:var(--t2)}
.kv{display:grid;grid-template-columns:52px 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--t3)} .kv dd{margin:0;color:var(--t1);word-break:keep-all}
.meta{font-size:14px;color:var(--t3);text-align:center}

/* 결과 */
.sum{display:grid;grid-template-columns:repeat(3,1fr);border-radius:20px;background:var(--sub);padding:18px 8px}
.sum div{text-align:center}
.sum b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--t3)}
.sum div+div{border-left:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:14px;padding:22px 0;border-top:8px solid var(--sub);margin:0 -20px;padding-left:20px;padding-right:20px}
.sec h2{margin:0;font-size:19px;font-weight:700;word-break:keep-all;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:3px 7px}
.chip.agree{background:var(--blue-soft);color:var(--blue)}
.chip.split{background:var(--sub);color:var(--t2)}
.rank{display:flex;flex-direction:column;gap:12px}
.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.r .n{font-size:15px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
.r .l{font-size:16px;word-break:keep-all}
.r .p{font-size:15px;font-weight:600;color:var(--t2);font-variant-numeric:tabular-nums}
.r .bar{grid-column:2/4;height:6px;border-radius:6px;background:var(--sub);overflow:hidden}
.r .bar i{display:block;height:100%;border-radius:6px;background:var(--t3);opacity:.45}
.r.first .n,.r.first .p{color:var(--blue)}
.r.first .l{font-weight:700}
.r.first .bar i{background:var(--blue);opacity:1}
.mine{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.quote{background:var(--sub);border-radius:14px;padding:14px 16px;font-size:16px;word-break:keep-all}
.small{font-size:14px;color:var(--t3);word-break:keep-all}
</style>
</head>
<body>

<main class="page" id="intro">
  <div class="nav"></div>
  <div class="body">
    <div class="title">
      <h1>희라라면<br>무엇을 고를까요?</h1>
      <p>희라가 되어 16개 질문에 답해 주세요.<br>정답은 없어요. 3분이면 끝나요.</p>
    </div>
    <div class="profile">
      <div class="who"><div class="ava">희</div><div><b>김희라</b><span>44세 · 여성</span></div></div>
      <dl class="kv">
        <dt>철학</dt><dd>웰니스</dd>
        <dt>성격</dt><dd>주체적, 털털함, 자기만족, 중성적, 완벽주의, 지적</dd>
        <dt>취미</dt><dd>요가, 필라테스, 러닝, 다도, 독서, 일</dd>
        <dt>식성</dt><dd>슴슴한 음식, 차, 소식, 술·담배 안 함</dd>
      </dl>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label class="label" for="name">내 이름</label>
      <input class="input" type="text" id="name" maxlength="20" placeholder="이름을 입력해 주세요" autocomplete="name">
    </div>
    <p class="meta" id="status">불러오는 중</p>
  </div>
  <div class="dock"><div class="in"><button class="btn" id="start" disabled>시작하기</button></div></div>
</main>

<main class="page" id="quiz" hidden>
  <div class="nav">
    <button class="back" id="prev" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="prog"><i id="bar" style="width:0"></i></div>
    <span class="step" id="qnum"></span>
  </div>
  <div class="body">
    <div class="title">
      <h1 id="qtitle"></h1>
      <p class="hint" id="qhint"></p>
    </div>
    <div class="list" id="list"></div>
    <input class="input" type="text" id="other" maxlength="80" placeholder="목록에 없으면 직접 입력">
    <textarea class="input" id="free" maxlength="200" hidden></textarea>
  </div>
  <div class="dock"><div class="in">
    <p class="err" id="qerr" hidden></p>
    <button class="btn" id="next">다음</button>
  </div></div>
</main>

<main class="page" id="result" hidden>
  <div class="nav"></div>
  <div class="body" id="resBody"></div>
  <div class="dock"><div class="in"><button class="btn sub" id="edit">내 답 다시 고르기</button></div></div>
</main>

<script>
const Q = [
  {id:"job", t:"희라는 어떤 일을 할까요?", o:["회사원(관리자급)","전문직(의료·법률 등)","자기 사업·프리랜서","크리에이티브 직군","교육·강사","전업 주부"]},
  {id:"family", t:"희라는 누구와 살까요?", o:["혼자","배우자와 둘이","배우자·어린 자녀와","배우자·다 큰 자녀와","부모님과"]},
  {id:"place", t:"희라는 어디에 살까요?", o:["서울 도심","수도권 신도시","지방 대도시","지방 중소도시"]},
  {id:"skin", t:"희라가 가장 신경 쓰는\n피부 고민은요?", max:2, o:["탄력·처짐","잔주름","속건조·당김","칙칙함·기미","예민·붉은기","모공·피부결"]},
  {id:"derm", t:"희라는 피부과에\n다닐까요?", o:["꾸준히 다닌다","다니다 지쳐서 그만뒀다","중요한 일 앞두고만 간다","시술은 싫어서 안 한다","관심은 있지만 아직"]},
  {id:"makeup", t:"희라는 화장을\n얼마나 할까요?", o:["거의 안 해요(선크림 정도)","가볍게 베이스만","매일 제대로"]},
  {id:"spend", t:"한 달 스킨케어에\n얼마나 쓸까요?", o:["5만 원 이하","5만~10만 원","10만~20만 원","20만 원 이상"]},
  {id:"time", t:"희라의 '나만의 시간'은\n언제일까요?", o:["이른 아침","낮","저녁","늦은 밤"]},
  {id:"apps", t:"희라가 휴대폰에서\n가장 오래 쓰는 앱은요?", max:3, o:["인스타그램","유튜브","네이버","카카오톡","스레드","핀터레스트","팟캐스트·오디오","뉴스레터·메일"]},
  {id:"trust", t:"화장품을 고를 때\n가장 믿는 건 뭘까요?", o:["피부과 의사·전문가","닮고 싶은 사람(인플루언서)","친한 친구의 추천","성분·연구 자료를 직접 확인","많은 리뷰·후기","백화점·매장 상담"]},
  {id:"check", t:"광고를 보고 끌리면\n제일 먼저 뭘 할까요?", o:["네이버에 브랜드 검색","브랜드 인스타 둘러보기","자사몰 상세페이지 꼼꼼히 읽기","유튜브에서 후기 찾기","지인에게 물어보기","저장만 하고 잊기"]},
  {id:"decide", t:"결제 버튼을 누르게 하는\n한 방은요?", o:["임상 수치","기술·연구진 설명","실제 사용자 후기","믿는 사람의 추천","환불 보장","첫 구매 혜택"]},
  {id:"block", t:"사지 않고 나가는\n이유는 뭘까요?", max:2, o:["광고 냄새·과장","처음 보는 브랜드라 불안","가격","쓰던 제품이 있어서","효과에 확신이 없어서","구매 과정이 번거로워서"]},
  {id:"tone", t:"희라에게 먹힐 광고는\n어떤 걸까요?", o:["조용하고 감도 높은 영상","숫자·근거가 담긴 카드","실사용자 인터뷰","전문가의 설명","일상 브이로그"]},
  {id:"brands", t:"희라 화장대에 있을 것 같은\n브랜드를 적어 주세요", free:true, ph:"예: 설화수, 라메르"},
  {id:"oneline", t:"희라를 한 문장으로\n표현해 주세요", free:true, ph:"예: 남 말보다 자기 기준이 분명한 사람"},
];
const API = "https://script.google.com/macros/s/AKfycbxXkBOA7YLDAp0gdTPkit98xvMJfskXuZF1yZC_CACtRNVjODIp_xpDK-Rxs_HsRZL4/exec";
const DRAFT_KEY = "heera-draft-v3";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let all = [], answers = {}, step = 0, submitted = false, busy = false;
const $ = s => document.querySelector(s);
const myName = () => $("#name").value.trim();

function loadDraft(){ try{ const d = JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d){ answers=d.answers||{}; $("#name").value=d.name||""; submitted=!!d.submitted; } }catch(e){} }
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({answers, name:myName(), submitted})); }catch(e){} }
function setStatus(t){ $("#status").textContent = t; }
function updateStart(){ $("#start").disabled = !myName(); }

async function call(kind, arg){
  const res = kind === "submit"
    ? await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(arg)})
    : await fetch(API);
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "저장하지 못했어요.");
  return data.responses;
}
async function refresh(){
  try{ all = await call("list"); setStatus(all.length ? `지금까지 ${all.length}명이 참여했어요` : "첫 번째 참여자가 되어 주세요"); if(!$("#result").hidden) renderResults(); }
  catch(e){ setStatus("결과를 불러오지 못했어요. 새로고침해 주세요."); }
}

$("#name").addEventListener("input", ()=>{ updateStart(); saveDraft(); });
$("#name").addEventListener("keydown", e=>{ if(e.key==="Enter" && myName()) $("#start").click(); });
$("#start").addEventListener("click", ()=>{ show("quiz"); step = 0; renderQ(); });
$("#prev").addEventListener("click", ()=>{ capture(); if(step>0){ step--; renderQ(); } else show("intro"); });
$("#next").addEventListener("click", ()=>{ capture(); go(); });
$("#other").addEventListener("input", ()=>{ capture(); syncNext(); });
$("#free").addEventListener("input", ()=>{ capture(); syncNext(); });
$("#edit").addEventListener("click", ()=>{ show("quiz"); step = 0; renderQ(); });

function show(id){ ["intro","quiz","result"].forEach(x=>$("#"+x).hidden = x!==id); window.scrollTo(0,0); }
function cur(){ const q=Q[step]; return answers[q.id] || (q.free ? {text:""} : {pick:[], other:""}); }
function capture(){
  const q = Q[step]; if(!q) return;
  if(q.free) answers[q.id] = {text: $("#free").value.trim()};
  else answers[q.id] = {...cur(), other: $("#other").value.trim()};
  saveDraft();
}
function filled(q){ const a = answers[q.id]; return !!a && (q.free || a.pick.length>0 || !!a.other); }
function syncNext(){
  const q = Q[step], last = step === Q.length-1;
  $("#next").textContent = last ? "제출하고 결과 보기" : (q.free && !cur().text ? "건너뛰기" : "다음");
  $("#next").disabled = busy || (!q.free && !filled(q));
  if(busy) $("#next").textContent = "저장하는 중";
}
function go(){ if(step < Q.length-1){ step++; renderQ(); } else submit(); }
function renderQ(){
  const q = Q[step], a = cur();
  $("#qnum").textContent = `${step+1}/${Q.length}`;
  $("#bar").style.width = `${(step+1)/Q.length*100}%`;
  $("#qtitle").textContent = ""; q.t.split("\n").forEach((line,i)=>{ if(i) $("#qtitle").append(document.createElement("br")); $("#qtitle").append(line); });
  $("#qhint").textContent = q.free ? "비워 둬도 괜찮아요" : (q.max ? `최대 ${q.max}개까지 고를 수 있어요` : "하나를 고르면 다음으로 넘어가요");
  $("#qerr").hidden = true;
  const box = $("#list"); box.replaceChildren();
  box.hidden = !!q.free; $("#other").hidden = !!q.free; $("#free").hidden = !q.free;
  if(q.free){ $("#free").value = a.text||""; $("#free").placeholder = q.ph||""; }
  else{
    $("#other").value = a.other||"";
    q.o.forEach(label=>{
      const b = document.createElement("button"); b.className = "item"; b.type = "button";
      b.setAttribute("aria-pressed", a.pick.includes(label) ? "true" : "false");
      const l = document.createElement("span"); l.className = "lab"; l.textContent = label;
      const c = document.createElement("span"); c.className = "chk"; c.innerHTML = CHECK;
      b.append(l, c);
      b.addEventListener("click", ()=>{
        const st = cur(); let pick = [...st.pick];
        if(pick.includes(label)) pick = pick.filter(x=>x!==label);
        else if(q.max){ if(pick.length >= q.max) pick.shift(); pick.push(label); }
        else pick = [label];
        answers[q.id] = {...st, pick}; saveDraft();
        if(!q.max && pick.length){
          [...box.children].forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
          setTimeout(go, 220);
        } else renderQ();
      });
      box.append(b);
    });
  }
  syncNext();
}

async function submit(){
  busy = true; syncNext();
  try{
    all = await call("submit", {name: myName(), answers});
    submitted = true; saveDraft(); show("result"); renderResults();
  }catch(e){
    $("#qerr").textContent = (e && e.message) || "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; $("#qerr").hidden = false;
  }finally{ busy = false; if(!$("#quiz").hidden) syncNext(); }
}

function tally(q){
  const n = all.length || 1, cnt = {};
  q.o.forEach(o=>cnt[o]=0);
  all.forEach(r=>(r.answers?.[q.id]?.pick||[]).forEach(p=>{ if(p in cnt) cnt[p]++; }));
  return q.o.map(label=>({label, pct: Math.round(cnt[label]/n*100)})).sort((a,b)=>b.pct-a.pct);
}
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }
function renderResults(){
  const R = $("#resBody"); R.replaceChildren();
  const me = all.find(r=>r.name===myName());
  const choiceQs = Q.filter(q=>!q.free);
  const agree = choiceQs.filter(q=>all.length && tally(q)[0].pct>=50).length;

  const head = el("div","title");
  const h = el("h1"); h.append("우리 팀이 그린", document.createElement("br"), "김희라예요");
  head.append(h, el("p", null, "절반 이상이 같은 답을 고르면 '교집합'이에요."));
  const sum = el("div","sum");
  [[all.length,"참여"],[agree,"교집합"],[choiceQs.length-agree,"의견 갈림"]].forEach(([v,l])=>{ const d=el("div"); d.append(el("b",null,String(v)), el("span",null,l)); sum.append(d); });
  R.append(head, sum);

  Q.forEach(q=>{
    const s = el("section","sec");
    const h2 = el("h2", null, q.t.replace("\n"," "));
    s.append(h2);
    if(q.free){
      const texts = all.map(r=>r.answers?.[q.id]?.text).filter(Boolean);
      if(!texts.length) s.append(el("p","small","아직 적은 사람이 없어요"));
      texts.forEach(x=>s.append(el("div","quote",x)));
      R.append(s); return;
    }
    const rows = tally(q), ok = all.length && rows[0].pct >= 50;
    h2.append(el("span","chip " + (ok ? "agree":"split"), ok ? "교집합" : "의견 갈림"));
    const minePick = me?.answers?.[q.id]?.pick || [];
    const rank = el("div","rank");
    rows.filter((r,i)=>i===0 || r.pct>0 || minePick.includes(r.label)).forEach((r,i)=>{
      const row = el("div","r" + (i===0 ? " first":""));
      const l = el("span","l",r.label); if(minePick.includes(r.label)) l.append(el("span","mine","내 답"));
      const bar = el("div","bar"); const fill = el("i"); fill.style.width = r.pct + "%"; bar.append(fill);
      row.append(el("span","n",String(i+1)), l, el("span","p",r.pct + "%"), bar);
      rank.append(row);
    });
    s.append(rank);
    const others = all.map(r=>r.answers?.[q.id]?.other).filter(Boolean);
    if(others.length) s.append(el("p","small","직접 입력: " + others.join(" / ")));
    R.append(s);
  });
}

loadDraft(); updateStart();
refresh().then(()=>{ if(submitted && all.some(r=>r.name===myName())){ show("result"); renderResults(); } });
setInterval(()=>{ if(!document.hidden && !$("#result").hidden) refresh(); }, 30000);
</script>
